services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bleep-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bleep-backend-lab1
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - bleep_data:/app/data
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    links:
      - rabbitmq

volumes:
  bleep_data:
